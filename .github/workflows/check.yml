name: Build and tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/*.test.mjs
      - run: npm run build
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
